# Policy for the multi-provider example. Only the models section differs from the defaults.
version: 1

models:
  hunters:  { connection: anthropic-main, model: claude-sonnet-5-5 }
  judges:   { connection: anthropic-main, model: claude-opus-5-5 }
  # Used when a seat's primary connection is rate limited or down. Recorded on the verdict.
  fallback: { connection: openai-main, model: gpt-5 }
  # Alternate hunters across both connections; judges prefer the connection serving fewer hunters.
  decorrelate: true

budget:
  perChangeUsd: 25
